# Pull-request gate. Plan: docs/exec-plans/active/ci-pr-gate.md
# Mirrors the local proof chain in docs/architecture/VERSION_MATRIX.md.
# No deploy, publish, or tag step belongs in this workflow.
name: CI

on:
  pull_request:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the git-backed created/modified dates resolve.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from .node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Prettier
        run: npx prettier . --check

      - name: Unit tests (explicit globs in package.json)
        run: npm test

      - name: Content schema and ID validation
        run: npm run validate:content

      - name: Quartz build
        run: npx quartz build --concurrency=1

      - name: Graph output validation
        run: npm run validate:graph

      - name: Wrangler dry run (assets-only Worker, no credentials)
        run: npx wrangler deploy --dry-run
